const routes=[['home','Beranda'],['roadmap','Roadmap'],['learning','Modul'],['labs','Lab'],['progress','Progres'],['notes','Catatan'],['reports','Laporan']];
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeURL=u=>String(u).startsWith('https://')?u:'#';
const setLocal=(key,v)=>localStorage.setItem('vulnlab-demo-'+key,JSON.stringify(v));
const getLocal=(key,defaultValue)=>{try{return JSON.parse(localStorage.getItem('vulnlab-demo-'+key))??defaultValue}catch{return defaultValue}};
let page='home',lessonIdx=0,labIdx=0,dayIdx=0,answers={},attemptResult=null;
let state={theme:getLocal('theme','light'),days:getLocal('days',{}),quizzes:getLocal('quizzes',{}),notes:getLocal('notes',{}),report:getLocal('report',{}),read:getLocal('read',{})};
function persist(){for(const key of ['theme','days','quizzes','notes','report','read'])setLocal(key,state[key]);}
function pct(n,d){return Math.round(100*(n||0)/(d||1));}
function layoutHeader(){document.body.setAttribute('data-theme',state.theme);document.getElementById('nav').innerHTML=routes.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="show('${id}')">${label}</button>`).join('');document.getElementById('mobile').innerHTML=routes.slice(0,4).map(([id,label])=>`<button class="${page===id?'active':''}" onclick="show('${id}')">${label}</button>`).join('') + `<button onclick="toggleMore()" class="${['progress','notes','reports'].includes(page)?'active':''}">Lainnya</button>`;}
const card=(inner,cls='')=>`<div class="card ${cls}">${inner}</div>`;
function toggleMore(){document.getElementById('moremenu').classList.toggle('show');}
function show(p){document.getElementById('moremenu').classList.remove('show');page=p;layoutHeader();const views={home,roadmap,learning,labs,progress,notes,reports};document.getElementById('app').innerHTML=views[p]();window.scrollTo({top:0,behavior:'instant'});}
function home(){const done=Object.values(state.days).filter(Boolean).length;const passed=Object.values(state.quizzes).filter(Boolean).length;const next=ROAD.find(d=>!state.days[d.day])||ROAD[89];return `<section class="hero"><div><div class="eyebrow">THE FUTURE OF YOUR SECURITY SKILLS</div><h1>Belajar. Bereksperimen.<br><span style="color:var(--blue)">Jadi lebih aman.</span></h1><p class="muted">Satu jalur belajar berbahasa Indonesia dari dasar HTTP sampai praktik Web/API Security yang sah dan terukur.</p><div class="actions"><button class="btn" onclick="openLesson(0)">▶ Mulai dari HTTP</button><button class="btn secondary" onclick="show('roadmap')">Lihat roadmap 90 hari →</button></div></div><div class="hero-art"><div class="mountain" aria-hidden="true">🏔️</div></div></section><div class="section layout"><div>${card(`<div class="eyebrow">LANJUTKAN PERJALANAN</div><h2>Hari ${next.day}: ${escapeHTML(next.title)}</h2><p class="muted">Belajar 20 menit · Praktik 70 menit · Review 30 menit</p><div class="progress"><i style="width:${pct(done,90)}%"></i></div><p class="meta">${done} dari 90 hari selesai</p><button class="btn" onclick="openDay(${next.day-1})">Buka rencana hari ini →</button>`)}</div><div>${card(`<div class="eyebrow">LANGKAH KECIL, KONSISTEN</div><h2>${passed} kuis tuntas</h2><p class="muted">Ini adalah hasil dari kuis demo yang kamu selesaikan di browser. Kemampuan lab dinilai terpisah.</p><button class="btn secondary" onclick="show('progress')">Lihat progres →</button>`)}</div></div><h2>Mulai dari yang penting</h2><div class="grid">${[['🌐','Baca materi','25 pelajaran asli berbahasa Indonesia','learning'],['🧪','Jelajahi lab','8 skenario latihan terisolasi','labs'],['🗒️','Tulis temuan','Catatan dan latihan laporan','notes']].map(x=>card(`<div class="icon">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p><button class="btn secondary" onclick="show('${x[3]}')">Jelajahi →</button>`)).join('')}</div>`;}
function roadmap(){let done=Object.values(state.days).filter(Boolean).length;let html=`<div class="path-head"><span class="eyebrow">LEARNING JOURNEY</span><h1>Perjalanan 90 Hari</h1><p class="muted">Pilih hari, pelajari konsepnya, lalu tandai setelah benar-benar menyelesaikan kegiatannya.</p><div class="progress"><i style="width:${pct(done,90)}%"></i></div><p class="meta">${done}/90 hari terlaksana — bukan jumlah vulnerability yang kamu kuasai</p></div><div class="layout"><div>`;for(let w=0;w<13;w++){const week=ROAD.filter(x=>x.week===w+1);const completed=week.filter(d=>state.days[d.day]).length;html+=`<div class="route-step ${completed===week.length?'done':''}" data-num="${w+1}"><h3>Minggu ${w+1} — ${escapeHTML(week[0].phase)}</h3><p class="muted">${completed}/${week.length} hari selesai</p><div class="days">${week.map(d=>`<button class="day ${state.days[d.day]?'done':''}" title="${escapeHTML(d.title)}" onclick="openDay(${d.day-1})">${d.day}</button>`).join('')}</div></div>`;}html+=`</div><aside>${card(`<h3>Ritme harian</h3><p>📖 20 menit teori</p><p>🧪 70 menit praktik</p><p>📝 30 menit catatan dan review</p><div class="notice">Rencana bersifat fleksibel. Kamu tidak harus mendapat bounty dalam 90 hari.</div>`)}</aside></div>`;return html;}
function openDay(idx){dayIdx=idx;page='roadmap';layoutHeader();const d=ROAD[idx];document.getElementById('app').innerHTML=`<button class="soft" onclick="show('roadmap')">← Kembali ke roadmap</button><div class="card" style="margin-top:15px;max-width:850px"><span class="eyebrow">MINGGU ${d.week} · HARI ${d.day}</span><h1>${escapeHTML(d.title)}</h1><p class="muted">120 menit · ${escapeHTML(d.phase)}</p><h3>📖 Teori · 20 menit</h3><p>${escapeHTML(d.theory_action)}</p><h3>🧪 Praktik · 70 menit</h3><p>${escapeHTML(d.practice_action)}</p><h3>📝 Refleksi · 30 menit</h3><p>${escapeHTML(d.reflection_action)}</p><div class="notice">Tandai selesai setelah kamu benar-benar melakukan aktivitas. Ini hanya prototype dan belum terhubung ke akun Laravel.</div><div class="actions"><button class="btn" onclick="toggleDay(${d.day})">${state.days[d.day]?'Batalkan tanda selesai':'✓ Tandai selesai'}</button><button class="btn secondary" onclick="show('learning')">Buka modul →</button></div></div>`;}
function toggleDay(day){state.days[day]=!state.days[day];persist();openDay(day-1);}
function md2html(md){let s=escapeHTML(md);s=s.replace(/```(?:http|json|bash|\w+)?\n([\s\S]*?)```/g,(_,c)=>`<pre><code>${c}</code></pre>`);s=s.replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');s=s.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');s=s.replace(/^\- \[([^\]]+)\]\((https:\/\/[^)]+)\)$/gm,(_,name,url)=>`<div>↗ <a target="_blank" rel="noopener noreferrer" href="${safeURL(url)}">${name}</a></div>`);s=s.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');return s.split(/\n\n+/).map(chunk=>/^<(?:h\d|blockquote|pre|div)/.test(chunk)?chunk:`<p>${chunk.replace(/\n/g,'<br>')}</p>`).join('');}
function learning(){const groups=[...new Set(DATA.map(x=>x.track))];return `<span class="eyebrow">LEARNING STUDIO</span><h1>Materi yang mudah dipahami.<br><span style="color:var(--blue)">Sumber yang bisa diperiksa.</span></h1><p class="muted">25 pelajaran editorial draft, masing-masing dengan konsep, contoh HTTP, pencegahan, sumber resmi dan dua soal kuis.</p>${groups.map(g=>`<div class="section"><div class="row"><h2>${escapeHTML(g)}</h2><span class="pill">${DATA.filter(x=>x.track===g).length} materi</span></div><div class="grid">${DATA.map((x,i)=>({...x,i})).filter(x=>x.track===g).map(x=>card(`<span class="pill">${escapeHTML(x.level)}</span><h3 style="margin-top:12px">${escapeHTML(x.title)}</h3><p class="meta">${x.estimated_minutes} menit · ${x.quiz_ids.length} kuis · ${x.source_urls.length} sumber</p><p class="muted">${state.quizzes[x.id]?'✓ Kuis tuntas':'Belum lulus kuis'}</p><button class="btn secondary" onclick="openLesson(${x.i})">Buka materi →</button>`,'click')).join('')}</div></div>`).join('')}`;}
function openLesson(i){lessonIdx=i;answers={};attemptResult=null;page='learning';layoutHeader();let l=DATA[i];document.getElementById('app').innerHTML=`<button class="soft" onclick="show('learning')">← Semua materi</button><div class="reader section"><aside class="card listpanel"><h3>Daftar materi</h3>${DATA.map((x,j)=>`<button class="listitem ${i===j?'selected':''}" onclick="openLesson(${j})">${j+1}. ${escapeHTML(x.title)} ${state.quizzes[x.id]?'✓':''}</button>`).join('')}</aside><article class="card"><div class="row wrap"><span class="pill">${escapeHTML(l.track)} · ${l.estimated_minutes} menit</span><span class="meta">Status: draft terkurasi, belum direview pakar</span></div><div class="prose spaced">${md2html(l.body_md)}</div><div class="actions"><button class="btn secondary" onclick="markRead('${l.id}')">${state.read[l.id]?'✓ Sudah ditandai dibaca':'Tandai dibaca'}</button><button class="btn" onclick="renderQuiz()">Mulai kuis (2 soal) →</button></div><div id="quiz-area"></div></article></div>`;window.scrollTo(0,0);}
function markRead(id){state.read[id]=true;persist();openLesson(lessonIdx);}
function renderQuiz(){let l=DATA[lessonIdx];let qs=QUIZ.filter(q=>q.lesson_id===l.id);const node=document.getElementById('quiz-area');node.innerHTML=`<div class="section"><h2>Kuis: ${escapeHTML(l.title)}</h2><p class="muted">Dua jawaban benar diperlukan untuk lulus. Jawaban dan pembahasan tampil setelah kamu kirim.</p>${qs.map((q,k)=>`<div class="card" style="margin:10px 0"><h3>${k+1}. ${escapeHTML(q.question)}</h3>${q.options.map(o=>`<button class="quiz-option" data-q="${q.id}" data-opt="${o.id}" onclick="pick('${q.id}','${o.id}')">${o.id}. ${escapeHTML(o.text)}</button>`).join('')}</div>`).join('')}<button class="btn" onclick="grade()">Periksa jawabanku</button><div id="quiz-feedback" class="spaced"></div></div>`;node.scrollIntoView({behavior:'smooth',block:'start'});}
function pick(q,opt){answers[q]=opt;document.querySelectorAll('[data-q="'+q+'"]').forEach(b=>b.classList.toggle('chosen',b.dataset.opt===opt));}
function grade(){let qs=QUIZ.filter(q=>q.lesson_id===DATA[lessonIdx].id);if(qs.some(q=>!answers[q.id])){document.getElementById('quiz-feedback').innerHTML='<div class="notice">Jawab semua pertanyaan dahulu.</div>';return;}let correct=qs.filter(q=>answers[q.id]===q.correct_option).length,pass=correct===qs.length;if(pass)state.quizzes[DATA[lessonIdx].id]=true;persist();document.getElementById('quiz-feedback').innerHTML=`<div class="notice"><h3>${pass?'✓ Kuis tuntas!':'Coba lagi, ya.'} ${correct}/${qs.length} benar</h3><p>${pass?'Kamu memahami teori. Praktik lab masih perlu dibuktikan secara terpisah.':'Baca penjelasan berikut lalu coba lagi.'}</p>${qs.map(q=>`<p><b>${escapeHTML(q.question)}</b><br>Jawaban: ${escapeHTML(q.options.find(o=>o.id===q.correct_option).text)}<br>${escapeHTML(q.explanation)}</p>`).join('')}</div>`;}
function labs(){return `<span class="eyebrow">SAFE PRACTICE</span><h1>Lab Praktik</h1><p class="muted">8 skenario guided, memakai data fiktif dan rancangan lingkungan Docker terisolasi. Mesin lab belum berjalan pada prototype.</p><div class="grid">${LABS.map((l,i)=>card(`<span class="pill">${escapeHTML(l.difficulty)}</span><h3 style="margin-top:12px">${escapeHTML(l.title)}</h3><p class="muted">${escapeHTML(l.goal)}</p><p class="meta">${l.estimated_minutes} menit · ${escapeHTML(l.topic)}</p><button class="btn secondary" onclick="openLab(${i})">Lihat skenario →</button>`)).join('')}</div>`;}
function openLab(i){labIdx=i;let l=LABS[i];page='labs';layoutHeader();document.getElementById('app').innerHTML=`<button class="soft" onclick="show('labs')">← Katalog lab</button><div class="section"><span class="pill">${escapeHTML(l.topic)} · ${escapeHTML(l.difficulty)}</span><h1>${escapeHTML(l.title)}</h1><p class="muted">${escapeHTML(l.goal)}</p></div><div class="lab-pane"><div class="card"><h2>Instruksi latihan</h2><p>${escapeHTML(l.setup)}</p><h3>Langkah guided</h3><ol>${l.guided_steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol><details class="notice"><summary>Petunjuk bertahap</summary><ol>${l.hints.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol></details><h3 style="margin-top:20px">Perbaikan</h3><p>${escapeHTML(l.secure_remediation)}</p></div><div class="card"><div class="row"><h2>Workspace HTTP</h2><span class="pill">Tidak aktif</span></div><div class="notice">Sandbox tidak berjalan pada prototype. Jangan menampilkan HTTP response palsu. Codex perlu membangun runtime Docker terisolasi dan tes keamanan terlebih dahulu.</div><h3 style="margin-top:18px">Permintaan latihan (contoh, tidak dikirim)</h3><div class="terminal">${escapeHTML(JSON.stringify(l.safe_test_inputs,null,2))}</div><button class="btn secondary" disabled>Jalankan di sandbox (belum tersedia)</button></div></div>`;}
function progress(){const d=Object.values(state.days).filter(Boolean).length,q=Object.values(state.quizzes).filter(Boolean).length,read=Object.values(state.read).filter(Boolean).length;return `<span class="eyebrow">YOUR LEARNING STORY</span><h1>Perjalanan Belajarmu</h1><p class="muted">Angka di bawah berasal dari interaksi nyata pada prototype ini — bukan statistik demo yang dibuat-buat.</p><div class="grid">${[['Hari roadmap',d,90],['Materi ditandai dibaca',read,DATA.length],['Kuis lulus',q,DATA.length]].map(([name,val,total])=>card(`<div class="stat">${val}<span class="meta"> / ${total}</span></div><h3>${name}</h3><div class="progress"><i style="width:${pct(val,total)}%"></i></div>`)).join('')}</div><div class="section card"><h2>Empat lapisan belajar</h2><div class="grid two">${[['📖','Baca materi',read+'/'+DATA.length],['🧠','Lulus kuis',q+'/'+DATA.length],['🧪','Lab terselesaikan','Belum tersedia'],['📝','Laporan dinilai','Belum tersedia']].map(x=>`<div class="card soft"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div>`).join('')}</div></div><p class="notice">Di aplikasi final, seluruh progres akan disimpan pada database Laravel per akun, diverifikasi di server, dan dihitung secara transparan.</p>`;}
function notes(){const keys=Object.keys(state.notes);return `<span class="eyebrow">KNOWLEDGE GARDEN</span><h1>Catatan Peneliti</h1><p class="muted">Pertanyaan bagus sering dimulai dari satu catatan kecil. Isi di browser demo tidak otomatis tersinkron ke server.</p><div class="note-grid"><div class="card"><button class="btn" onclick="newNote()">+ Catatan baru</button><div class="section">${keys.length?keys.map(k=>`<button class="listitem" onclick="editNote('${k}')">🗒️ ${escapeHTML(state.notes[k].title||'Tanpa judul')}</button>`).join(''):'<p class="muted">Belum ada catatan.</p>'}</div></div><div class="card" id="note-editor"><h2>Catatan pertamamu dimulai dari pertanyaan kecil.</h2><p class="muted">Pilih catatan di sebelah kiri atau buat yang baru.</p></div></div>`;}
function newNote(){let k='note'+Date.now();state.notes[k]={title:'Catatan Baru',body:''};persist();editNote(k);}
function editNote(k){let n=state.notes[k];document.getElementById('note-editor').innerHTML=`<h2>Editor catatan</h2><div class="field"><label>Judul</label><input id="n-title" value="${escapeHTML(n.title)}"></div><div class="field"><label>Isi Markdown</label><textarea id="n-body">${escapeHTML(n.body)}</textarea></div><button class="btn" onclick="saveNote('${k}')">Simpan catatan</button><div class="meta spaced">Prototype: simpan manual ke localStorage. Implementasi final: autosave DB dengan revision conflict handling.</div>`;}
function saveNote(k){state.notes[k]={title:document.getElementById('n-title').value,body:document.getElementById('n-body').value};persist();show('notes');editNote(k);}
function reports(){const fields=[['title','Judul laporan','text'],['summary','Ringkasan','textarea'],['scope','Lingkungan / scope','text'],['steps','Langkah reproduksi','textarea'],['expected','Hasil diharapkan','textarea'],['observed','Hasil aktual','textarea'],['impact','Dampak terverifikasi','textarea'],['evidence','Bukti yang disanitasi','textarea'],['fix','Saran perbaikan','textarea']];return `<span class="eyebrow">REPORT STUDIO</span><h1>Tulis Laporan Bug</h1><p class="muted">Latihan membuat laporan dari data lab fiktif, bukan mengirimkan bounty sungguhan.</p><div class="layout"><div class="card">${fields.map(([key,title,kind])=>`<div class="field"><label for="r-${key}">${title}</label>${kind==='text'?`<input id="r-${key}" value="${escapeHTML(state.report[key]||'')}">`:`<textarea id="r-${key}" style="min-height:92px">${escapeHTML(state.report[key]||'')}</textarea>`}</div>`).join('')}<button class="btn" onclick="saveReport()">Simpan draft</button><button class="btn secondary" onclick="exportReport()">Unduh Markdown</button></div><aside>${card(`<h3>Checklist laporan jelas</h3><p>✓ Scope dummy dan izin latihan</p><p>✓ Langkah dapat direproduksi</p><p>✓ Expected vs actual berbeda jelas</p><p>✓ Bukti tidak mengandung token asli</p><p>✓ Dampak tidak dilebihkan</p><p>✓ Ada ide perbaikan</p><div class="notice">Aplikasi final menilai kelengkapan dengan rubric dan menyimpan draft di Laravel.</div>`)}</aside></div>`;}
function saveReport(){for(const k of ['title','summary','scope','steps','expected','observed','impact','evidence','fix'])state.report[k]=document.getElementById('r-'+k).value;persist();alert('Draft tersimpan di browser prototype.');}
function exportReport(){saveReport();const r=state.report;const md=Object.entries(r).map(([key,val])=>`## ${key}\n\n${val||''}`).join('\n\n');const blob=new Blob([md],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vulnlab-report-draft.md';a.click();URL.revokeObjectURL(a.href);}
document.getElementById('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';persist();layoutHeader();};show('home');
</script></body></html>
